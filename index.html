<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather Station</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --panel-bg:#1c1f24;
    --panel-raised:#262a31;
    --panel-line:#34393f;
    --brass:#c79a4b;
    --cyan:#5fb3c9;
    --alert:#c1453a;
    --good:#5c9a6b;
    --text:#eae6da;
    --muted:#8b9099;
    --accent:#c79a4b;
    --accent2:#5fb3c9;
    --accent-glow:rgba(199,154,75,0.25);
    /* condition palette */
    --sun:#f5b942; --sun2:#ff8a4c;
    --cloud:#8fa3d9; --cloud2:#5f7bc9;
    --rain:#4fb3e0; --rain2:#3a7fc9;
    --snow:#bfe9f0; --snow2:#7fd8e0;
    --storm:#b98af0; --storm2:#7c5bd9;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    background:
      radial-gradient(ellipse 700px 500px at 15% -5%, var(--accent-glow), transparent 60%),
      radial-gradient(ellipse 600px 500px at 100% 10%, rgba(95,179,201,0.16), transparent 55%),
      repeating-linear-gradient(180deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px),
      var(--panel-bg);
    font-family:'Inter', sans-serif; color:var(--text);
    padding:44px 18px 70px;
    transition:background 0.6s ease;
  }
  .wrap{max-width:820px; margin:0 auto;}
  .eyebrow{
    font-family:'JetBrains Mono', monospace; font-size:11.5px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--accent); margin:0 0 6px; transition:color .6s ease;
  }
  h1{
    font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:clamp(28px,4.6vw,38px);
    margin:0 0 6px; letter-spacing:-0.01em;
    background:linear-gradient(90deg, var(--text) 40%, var(--accent2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    transition:background .6s ease;
  }
  .sub{color:var(--muted); font-size:14px; margin:0 0 26px;}

  .search-row{display:flex; gap:8px; margin-bottom:24px; flex-wrap:wrap;}
  .search-row input{
    flex:1 1 220px; background:var(--panel-raised); border:1px solid var(--panel-line);
    border-radius:6px; padding:12px 14px; color:var(--text); font-family:'Inter',sans-serif; font-size:14.5px;
    outline:none;
  }
  .search-row input:focus{border-color:var(--brass);}
  .btn{
    font-family:'JetBrains Mono', monospace; font-size:12px; letter-spacing:.04em;
    background:linear-gradient(135deg, var(--accent), var(--accent2)); color:#161a1f; border:none; border-radius:6px; padding:0 18px;
    cursor:pointer; font-weight:700; text-transform:uppercase; transition:filter .15s, background .6s ease;
    min-height:40px;
  }
  .btn:hover{filter:brightness(1.12);}
  .btn.ghost{background:var(--panel-raised); color:var(--accent2); border:1px solid var(--panel-line); transition:color .6s ease;}
  .suggestions{
    background:var(--panel-raised); border:1px solid var(--panel-line); border-radius:6px;
    margin:-16px 0 20px; overflow:hidden; display:none;
  }
  .suggestions.show{display:block;}
  .suggestions div{padding:10px 14px; font-size:13.5px; cursor:pointer; border-bottom:1px solid var(--panel-line);}
  .suggestions div:last-child{border-bottom:none;}
  .suggestions div:hover{background:#31363e;}

  .status{font-family:'JetBrains Mono', monospace; font-size:12.5px; color:var(--muted); margin-bottom:18px; min-height:18px;}
  .status.err{color:var(--alert);}

  .panel{
    background:linear-gradient(180deg, rgba(255,255,255,0.03), transparent 40%), var(--panel-raised);
    border:1px solid var(--panel-line); border-radius:10px;
    padding:28px; margin-bottom:22px; display:none;
    box-shadow:0 0 0 1px rgba(255,255,255,0.02), 0 20px 50px -25px var(--accent-glow);
    transition:box-shadow .6s ease;
  }
  .panel.show{display:block;}
  .station-head{display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:14px; margin-bottom:22px;}
  .place{font-family:'Space Grotesk', sans-serif; font-size:19px; font-weight:600;}
  .place span{display:block; font-family:'JetBrains Mono', monospace; font-size:11.5px; color:var(--muted); font-weight:400; margin-top:3px;}
  .updated{font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--muted); text-align:right;}

  .readout-row{display:flex; align-items:center; gap:34px; flex-wrap:wrap; margin-bottom:26px;}
  .lcd{
    font-family:'JetBrains Mono', monospace; font-weight:700; font-size:64px; color:var(--accent);
    line-height:1; letter-spacing:-.02em; text-shadow:0 0 24px var(--accent-glow); transition:color .6s ease;
  }
  .lcd sup{font-size:26px; vertical-align:super;}
  .cond{
    font-family:'Space Grotesk', sans-serif; font-size:16px; font-weight:600; margin-bottom:4px;
    display:inline-flex; align-items:center; gap:6px; padding:3px 10px 3px 3px; border-radius:20px;
    background:color-mix(in srgb, var(--accent2) 18%, transparent); transition:background .6s ease;
  }
  .feels{font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--muted);}

  .gauges{display:flex; gap:28px; flex-wrap:wrap; margin-bottom:6px;}
  .gauge{text-align:center;}
  .gauge svg{display:block; margin:0 auto 6px;}
  .gauge .val{font-family:'JetBrains Mono', monospace; font-size:15px; font-weight:700; color:var(--text);}
  .gauge .lbl{font-family:'JetBrains Mono', monospace; font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em;}
  .gauge.humidity .val{color:var(--rain);}
  .gauge.wind .val{color:var(--accent);}

  .divider{border:none; border-top:1px dashed var(--panel-line); margin:22px 0;}

  .log-title{font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:12px;}
  .log{list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); gap:10px;}
  .log li{
    background:var(--panel-bg); border:1px solid var(--panel-line); border-top:3px solid var(--card-accent, var(--accent));
    border-radius:6px; padding:12px 10px; text-align:center;
  }
  .log .day{font-family:'JetBrains Mono', monospace; font-size:10.5px; color:var(--card-accent, var(--accent)); text-transform:uppercase; margin-bottom:6px;}
  .log .icon{font-size:22px; margin-bottom:4px;}
  .log .hi{font-family:'JetBrains Mono', monospace; font-size:13px; font-weight:700; color:var(--text);}
  .log .lo{font-family:'JetBrains Mono', monospace; font-size:11.5px; color:var(--muted);}

  footer{text-align:center; margin-top:26px; color:var(--muted); font-size:11.5px; font-family:'JetBrains Mono', monospace;}
  footer a{color:var(--cyan);}

  @media (max-width:520px){
    .readout-row{gap:20px;}
    .lcd{font-size:48px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">// atmospheric readout</p>
  <h1>Weather Station</h1>
  <p class="sub">Live conditions detected from your location, or search any city on the map.</p>

  <div class="search-row">
    <input type="text" id="cityInput" placeholder="Search a city…" autocomplete="off">
    <button class="btn" id="searchBtn">Search</button>
    <button class="btn ghost" id="detectBtn">📍 Detect My Location</button>
  </div>
  <div class="suggestions" id="suggestions"></div>
  <div class="status" id="status"></div>

  <div class="panel" id="panel">
    <div class="station-head">
      <div class="place" id="placeName">—<span id="placeMeta"></span></div>
      <div class="updated" id="updated"></div>
    </div>

    <div class="readout-row">
      <div>
        <div class="lcd" id="lcdTemp">--<sup>°C</sup></div>
        <div class="cond" id="condText">—</div>
        <div class="feels" id="feelsLike">—</div>
      </div>
      <div class="gauges">
        <div class="gauge humidity">
          <svg width="64" height="64" viewBox="0 0 64 64">
            <circle cx="32" cy="32" r="26" fill="none" stroke="#34393f" stroke-width="6"/>
            <circle id="humidityArc" cx="32" cy="32" r="26" fill="none" stroke="var(--rain)" stroke-width="6" stroke-linecap="round" stroke-dasharray="163" stroke-dashoffset="163" transform="rotate(-90 32 32)"/>
          </svg>
          <div class="val" id="humidityVal">--%</div>
          <div class="lbl">Humidity</div>
        </div>
        <div class="gauge wind">
          <svg width="64" height="64" viewBox="0 0 64 64">
            <circle cx="32" cy="32" r="26" fill="none" stroke="#34393f" stroke-width="6"/>
            <circle id="windArc" cx="32" cy="32" r="26" fill="none" stroke="var(--accent)" stroke-width="6" stroke-linecap="round" stroke-dasharray="163" stroke-dashoffset="163" transform="rotate(-90 32 32)"/>
          </svg>
          <div class="val" id="windVal">-- km/h</div>
          <div class="lbl">Wind</div>
        </div>
      </div>
    </div>

    <hr class="divider">

    <div class="log-title">7-Day Log</div>
    <ul class="log" id="forecastLog"></ul>
  </div>

  <footer>Data via <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo</a> · no API key required</footer>
</div>

<script>
(function(){
  const cityInput = document.getElementById('cityInput');
  const searchBtn = document.getElementById('searchBtn');
  const detectBtn = document.getElementById('detectBtn');
  const suggestionsEl = document.getElementById('suggestions');
  const statusEl = document.getElementById('status');
  const panel = document.getElementById('panel');

  const WEATHER_CODES = {
    0:['Clear sky','☀️'],1:['Mainly clear','🌤️'],2:['Partly cloudy','⛅'],3:['Overcast','☁️'],
    45:['Fog','🌫️'],48:['Depositing rime fog','🌫️'],
    51:['Light drizzle','🌦️'],53:['Drizzle','🌦️'],55:['Dense drizzle','🌧️'],
    61:['Slight rain','🌧️'],63:['Rain','🌧️'],65:['Heavy rain','🌧️'],
    71:['Slight snow','🌨️'],73:['Snow','🌨️'],75:['Heavy snow','❄️'],
    80:['Rain showers','🌦️'],81:['Rain showers','🌧️'],82:['Violent showers','⛈️'],
    95:['Thunderstorm','⛈️'],96:['Thunderstorm w/ hail','⛈️'],99:['Thunderstorm w/ hail','⛈️']
  };

  function paletteForCode(code){
    if(code === 0 || code === 1) return {a:'var(--sun)', b:'var(--sun2)', glow:'rgba(245,185,66,0.28)'};
    if(code === 2 || code === 3) return {a:'var(--cloud)', b:'var(--cloud2)', glow:'rgba(143,163,217,0.25)'};
    if(code === 45 || code === 48) return {a:'#9aa3ab', b:'#6f7780', glow:'rgba(154,163,171,0.22)'};
    if(code >= 51 && code <= 67) return {a:'var(--rain)', b:'var(--rain2)', glow:'rgba(79,179,224,0.28)'};
    if(code >= 71 && code <= 77) return {a:'var(--snow)', b:'var(--snow2)', glow:'rgba(191,233,240,0.28)'};
    if(code >= 80 && code <= 82) return {a:'var(--rain)', b:'var(--rain2)', glow:'rgba(79,179,224,0.28)'};
    if(code >= 95) return {a:'var(--storm)', b:'var(--storm2)', glow:'rgba(185,138,240,0.3)'};
    return {a:'var(--brass)', b:'var(--cyan)', glow:'rgba(199,154,75,0.25)'};
  }

  function applyPalette(code){
    const p = paletteForCode(code);
    const root = document.documentElement.style;
    root.setProperty('--accent', p.a);
    root.setProperty('--accent2', p.b);
    root.setProperty('--accent-glow', p.glow);
  }

  function setStatus(msg, isErr){
    statusEl.textContent = msg || '';
    statusEl.className = 'status' + (isErr ? ' err' : '');
  }

  async function geocodeCity(name){
    const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(name)}&count=5&language=en&format=json`;
    const res = await fetch(url);
    if(!res.ok) throw new Error('Geocoding request failed');
    const data = await res.json();
    return data.results || [];
  }

  async function fetchWeather(lat, lon){
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
      `&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m` +
      `&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto`;
    const res = await fetch(url);
    if(!res.ok) throw new Error('Weather request failed');
    return res.json();
  }

  function setArc(el, pct){
    const circumference = 163;
    const offset = circumference - (Math.min(Math.max(pct,0),100)/100)*circumference;
    el.style.strokeDashoffset = offset;
  }

  function renderWeather(place, data){
    const cur = data.current;
    const code = cur.weather_code;
    const [condLabel, condIcon] = WEATHER_CODES[code] || ['Unknown', '❓'];
    applyPalette(code);

    document.getElementById('condText').innerHTML = `<span style="font-size:18px">${condIcon}</span> ${condLabel}`;
    document.getElementById('placeName').innerHTML = `${place.name}<span>${[place.admin1, place.country].filter(Boolean).join(', ')}</span>`;
    document.getElementById('updated').textContent = 'Updated ' + new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    document.getElementById('lcdTemp').innerHTML = `${Math.round(cur.temperature_2m)}<sup>°C</sup>`;
    document.getElementById('feelsLike').textContent = `Feels like ${Math.round(cur.apparent_temperature)}°C`;
    document.getElementById('humidityVal').textContent = `${Math.round(cur.relative_humidity_2m)}%`;
    document.getElementById('windVal').textContent = `${Math.round(cur.wind_speed_10m)} km/h`;
    setArc(document.getElementById('humidityArc'), cur.relative_humidity_2m);
    setArc(document.getElementById('windArc'), Math.min(cur.wind_speed_10m, 60)/60*100);

    const log = document.getElementById('forecastLog');
    log.innerHTML = '';
    const days = data.daily.time;
    days.forEach((d, i) => {
      const dayCode = data.daily.weather_code[i];
      const [, icon] = WEATHER_CODES[dayCode] || ['', '❓'];
      const dayPalette = paletteForCode(dayCode);
      const dayName = i === 0 ? 'Today' : new Date(d).toLocaleDateString([], {weekday:'short'});
      const li = document.createElement('li');
      li.style.setProperty('--card-accent', dayPalette.a);
      li.innerHTML = `
        <div class="day">${dayName}</div>
        <div class="icon">${icon}</div>
        <div class="hi">${Math.round(data.daily.temperature_2m_max[i])}°</div>
        <div class="lo">${Math.round(data.daily.temperature_2m_min[i])}°</div>
      `;
      log.appendChild(li);
    });

    panel.classList.add('show');
  }

  async function loadForCoords(lat, lon, place){
    setStatus('Fetching current conditions…');
    try{
      const data = await fetchWeather(lat, lon);
      renderWeather(place, data);
      setStatus('');
    }catch(err){
      setStatus('Could not load weather data. Try again.', true);
    }
  }

  async function handleSearch(){
    const q = cityInput.value.trim();
    if(!q) return;
    setStatus('Searching…');
    suggestionsEl.classList.remove('show');
    try{
      const results = await geocodeCity(q);
      if(!results.length){ setStatus('No matching city found.', true); return; }
      if(results.length === 1){
        const r = results[0];
        loadForCoords(r.latitude, r.longitude, r);
        return;
      }
      suggestionsEl.innerHTML = '';
      results.forEach(r=>{
        const div = document.createElement('div');
        div.textContent = `${r.name}${r.admin1 ? ', '+r.admin1 : ''}, ${r.country}`;
        div.addEventListener('click', ()=>{
          suggestionsEl.classList.remove('show');
          cityInput.value = r.name;
          loadForCoords(r.latitude, r.longitude, r);
        });
        suggestionsEl.appendChild(div);
      });
      suggestionsEl.classList.add('show');
      setStatus('');
    }catch(err){
      setStatus('Search failed. Check your connection.', true);
    }
  }

  function handleDetect(){
    if(!navigator.geolocation){
      setStatus('Geolocation is not supported by this browser.', true);
      return;
    }
    setStatus('Detecting your location…');
    navigator.geolocation.getCurrentPosition(async pos=>{
      const { latitude, longitude } = pos.coords;
      try{
        const revUrl = `https://geocoding-api.open-meteo.com/v1/search?name=&count=1`;
        // Reverse-lookup fallback: use coordinates directly with a generic place label
        loadForCoords(latitude, longitude, { name: 'Your Location', admin1:'', country:'' });
      }catch(e){
        setStatus('Could not resolve your location.', true);
      }
    }, err=>{
      setStatus('Location access denied. Try searching a city instead.', true);
    });
  }

  searchBtn.addEventListener('click', handleSearch);
  cityInput.addEventListener('keydown', e=>{ if(e.key === 'Enter') handleSearch(); });
  detectBtn.addEventListener('click', handleDetect);
})();
</script>
</body>
</html>
